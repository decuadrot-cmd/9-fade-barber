<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9 Fade Barber · Panel</title><style>body{margin:0;background:#08080b;color:#fff;font-family:Arial,sans-serif;padding:24px}.box{max-width:800px;margin:auto}.card{background:#121217;border:1px solid #292934;border-radius:16px;padding:20px;margin:16px 0}input,button{padding:12px;border-radius:9px;border:1px solid #333;background:#19191f;color:#fff}input{width:100%;box-sizing:border-box;margin:6px 0 12px}button{background:#8b3dff;border:0;font-weight:800;cursor:pointer;margin:4px}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center}.ok{color:#7df5a4}.err{color:#ff7777}h1 span{color:#a855f7}</style></head><body><div class="box"><h1>9 <span>FADE</span> BARBER · PANEL</h1><div id="login" class="card"><h2>Acceso privado</h2><p>Entrá con el correo del administrador. Te llegará un enlace mágico.</p><input id="email" type="email" value="decuadrot@gmail.com"><button id="send">ENVIAR ENLACE</button><p id="msg"></p></div><div id="panel" class="hidden"><div class="card"><h2>Precios</h2><div id="services"></div><button id="saveServices">GUARDAR PRECIOS</button></div><div class="card"><h2>Horarios</h2><div id="schedules"></div><button id="saveSchedules">GUARDAR HORARIOS</button></div><div class="card"><h2>Ubicación e Instagram</h2><input id="maps" placeholder="Link de Google Maps"><input id="ig" placeholder="Link de Instagram"><button id="saveSettings">GUARDAR DATOS</button></div><div class="card"><h2>Fotos de cortes</h2><input id="photo" type="file" accept="image/*"><input id="photoTitle" placeholder="Nombre del corte"><button id="upload">SUBIR FOTO</button><div id="gallery"></div></div><div class="card"><button id="logout">CERRAR SESIÓN</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://fsyzlonyonzszvirkhrs.supabase.co',SB_KEY='sb_publishable_T1EAD9_Xv3UrQZ5ZFZiGyw_0qijwkMv',ADMIN='decuadrot@gmail.com';const sb=supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);function message(t,ok=false){$('msg').textContent=t;$('msg').className=ok?'ok':'err'}async function init(){const{data:{session}}=await sb.auth.getSession();if(session&&session.user.email===ADMIN)showPanel();}function showPanel(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(email!==ADMIN)return message('Ese correo no está autorizado.');const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});message(error?error.message:'Listo. Revisá tu correo y abrí el enlace.',!error)};sb.auth.onAuthStateChange((_,session)=>{if(session&&session.user.email===ADMIN)showPanel()});async function load(){let{data:s}=await sb.from('services').select('*').eq('active',true).order('sort_order');$('services').innerHTML=(s||[]).map(x=>`<div class="row"><input data-id="${x.id}" class="sn" value="${x.name}"><input data-id="${x.id}" class="sp" value="${x.price}"></div>`).join('');let{data:h}=await sb.from('schedules').select('*').order('id');$('schedules').innerHTML=(h||[]).map(x=>`<div class="row"><b>${x.day}</b><input data-id="${x.id}" class="sh" value="${x.hours}"></div>`).join('');let{data:g}=await sb.from('gallery').select('*').eq('active',true).order('sort_order');$('gallery').innerHTML=(g||[]).map(x=>`<div><img src="${x.image_url}" style="width:100px;height:80px;object-fit:cover;border-radius:8px"> ${x.title}</div>`).join('');let{data:set}=await sb.from('settings').select('*').limit(1).single();if(set){$('maps').value=set.location_url||'';$('ig').value=set.instagram_url||''}}$('saveServices').onclick=async()=>{for(const el of document.querySelectorAll('.sn'))await sb.from('services').update({name:el.value}).eq('id',el.dataset.id);for(const el of document.querySelectorAll('.sp'))await sb.from('services').update({price:el.value}).eq('id',el.dataset.id);alert('Precios guardados')};$('saveSchedules').onclick=async()=>{for(const el of document.querySelectorAll('.sh'))await sb.from('schedules').update({hours:el.value}).eq('id',el.dataset.id);alert('Horarios guardados')};$('saveSettings').onclick=async()=>{const{error}=await sb.from('settings').update({location_url:$('maps').value,instagram_url:$('ig').value}).eq('id',1);alert(error?error.message:'Datos guardados')};$('upload').onclick=async()=>{const f=$('photo').files[0];if(!f)return alert('Elegí una foto');const ext=f.name.split('.').pop().toLowerCase(),path=Date.now()+'.'+ext;const{error}=await sb.storage.from('gallery').upload(path,f,{upsert:false});if(error)return alert(error.message);const{data:u}=sb.storage.from('gallery').getPublicUrl(path);const{error:e}=await sb.from('gallery').insert({title:$('photoTitle').value||'Nuevo corte',image_url:u.publicUrl,sort_order:999,active:true});alert(e?e.message:'Foto subida');load()};$('logout').onclick=()=>sb.auth.signOut().then(()=>location.reload());init();</script></body></html>
